<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComeCome - Arcade Store</title>
  <link rel="icon" type="image/png" href="pacman-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  
  <!-- Fuente Retro Arcade -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css">

  <!-- PWA manifest -->
<link rel="manifest" href="/manifest.json">

<!-- Meta tags para iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ComeCome">
<link rel="apple-touch-icon" href="pacman-icon.png">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="pacman-icon.png" alt="ComeCome" style="height: 24px; width: 24px; object-fit: contain; margin-right: 0.8rem;">
        COMECOME
      </a>
      <div class="d-flex align-items-center gap-2">
        <!-- Botón de Alternancia de Modo Claro / Oscuro -->
        <button id="theme-toggle" class="btn btn-outline-pacman" type="button" aria-label="Cambiar Modo">
          <i id="theme-icon" class="bi bi-sun-fill"></i>
        </button>
        
        <!-- Botón del Carrito -->
        <button class="btn btn-outline-pacman position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
          <i class="bi bi-cart-fill"></i>
          <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Barra de categorías -->
  <div class="categorias-nav" id="categorias-nav">
    <div class="container" id="categorias-container">
      <span class="skeleton skeleton-chip"></span>
      <span class="skeleton skeleton-chip"></span>
      <span class="skeleton skeleton-chip"></span>
    </div>
  </div>

  <!-- Aviso de horario -->
  <div id="horario-aviso" class="alert alert-pacman text-center mb-0 d-none" role="alert">
    <i class="bi bi-clock"></i> FUERA DE HORARIO. <span id="horario-texto"></span>
  </div>

  <!-- Toast -->
  <div aria-live="polite" aria-atomic="true" class="toast-container position-fixed bottom-0 start-0 end-0 p-3" style="z-index: 11">
    <div id="toastPedido" class="toast align-items-center bg-black border-pacman" role="alert" data-bs-delay="5000">
      <div class="d-flex">
        <div class="toast-body text-white">
          <i class="bi bi-check-circle-fill text-pacman"></i> ¡PEDIDO ENVIADO!<br><small class="text-pacman mt-2 d-block">TE CONTACTAREMOS PRONTO.</small>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Contenido principal -->
  <main class="container my-4">
    <h2 class="mb-4 d-flex align-items-center gap-3 fs-5">
      <span class="icono-titulo"><i class="bi bi-controller"></i></span>
      NUESTRA CARTA
    </h2>
    <div id="productos-container" class="row row-cols-1 row-cols-md-3 g-4">
      <div class="col"><div class="skeleton skeleton-card"></div></div>
      <div class="col"><div class="skeleton skeleton-card"></div></div>
      <div class="col"><div class="skeleton skeleton-card"></div></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer text-center py-4 mt-5">
    <div class="container">
      <div class="footer-links mb-3">
        <a href="tel:+5356553393" class="footer-icon-link" title="Llamar"><i class="bi bi-telephone-fill"></i></a>
        <a href="https://wa.me/5356553393" target="_blank" class="footer-icon-link" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
        <a href="https://maps.app.goo.gl/g56dr6G34VgmH9Hj8" target="_blank" class="footer-icon-link" title="Cómo llegar"><i class="bi bi-geo-alt-fill"></i></a>
      </div>
      <small class="text-pacman copyright" id="copyright-text">© 2026 ComeCome</small>
    </div>
  </footer>

  <!-- Offcanvas carrito -->
  <div class="offcanvas offcanvas-end bg-black border-left-maze" tabindex="-1" id="carritoOffcanvas">
    <div class="offcanvas-header border-bottom-maze">
      <h5 class="offcanvas-title text-pacman"><i class="bi bi-cart2"></i> TU PEDIDO</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="carrito-lista" class="list-group mb-3"></div>

      <div class="mb-3">
        <label class="form-label text-pacman">MÉTODO DE PAGO</label>
        <select id="metodo-pago" class="form-select select-arcade" onchange="actualizarCarrito()">
          <option value="efectivo">EFECTIVO</option>
          <option value="transferencia">TRANSFERENCIA</option>
        </select>
        <small id="recargo-info" class="text-muted d-none mt-2 d-block"></small>
      </div>

      <div class="mb-3">
        <label class="form-label text-pacman">REPARTO</label>
        <div class="reparto-autocomplete">
          <input type="text" id="reparto-input" class="form-control input-arcade" placeholder="ZONA..." autocomplete="off" oninput="filtrarRepartos()" onfocus="mostrarSugerencias()">
          <input type="hidden" id="reparto-id" value="">
          <input type="hidden" id="reparto-precio" value="">
          <div class="reparto-sugerencias border-pacman" id="reparto-sugerencias"></div>
        </div>
        <div id="reparto-seleccionado" class="reparto-seleccionado bg-dark border-pacman d-none mt-2">
          <span id="reparto-seleccionado-texto" class="text-white"></span>
          <i class="bi bi-x-square-fill btn-limpiar text-danger" onclick="limpiarReparto()" title="Quitar reparto"></i>
        </div>
      </div>

      <div class="desglose mb-1 text-white">SUBTOTAL: <span id="subtotal-carrito" class="text-pacman">0.00</span> CUP</div>
      <div id="recargo-desglose" class="desglose mb-1 text-white d-none">RECARGO: <span id="recargo-aplicado" class="text-pacman">0.00</span> CUP</div>
      <div id="envio-desglose" class="desglose mb-1 text-white d-none">ENVÍO: <span id="envio-aplicado" class="text-pacman">0.00</span> CUP</div>
      
      <div class="d-flex justify-content-between text-pacman border-top-maze pt-3 mt-3">
        <span>TOTAL:</span>
        <span id="total-pedido">0.00 CUP</span>
      </div>
      <button id="btn-checkout" class="btn btn-pacman w-100 mt-4" disabled>
        INSERT COIN (PEDIR)
      </button>
    </div>
  </div>

  <!-- Offcanvas Datos de entrega -->
  <div class="offcanvas offcanvas-end bg-black border-left-maze" tabindex="-1" id="datosOffcanvas">
    <div class="offcanvas-header border-bottom-maze">
      <h5 class="offcanvas-title text-pacman"><i class="bi bi-pencil-square"></i> DATOS</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div id="checkout-error" class="alert alert-danger py-2 error-message rounded-0" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span id="error-text"></span>
      </div>
      <form id="checkout-form" class="text-white">
        <div class="mb-3">
          <label class="form-label text-pacman">NOMBRE</label>
          <input type="text" class="form-control input-arcade" id="nombre" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-pacman">TELÉFONO</label>
          <input type="tel" class="form-control input-arcade" id="telefono" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-pacman">DIRECCIÓN</label>
          <textarea class="form-control input-arcade" id="direccion" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label text-pacman">REFERENCIA</label>
          <textarea class="form-control input-arcade" id="referencia" rows="1"></textarea>
        </div>
      </form>
      <div class="d-flex gap-3 mt-4">
        <button type="button" class="btn btn-outline-pacman flex-fill" data-bs-dismiss="offcanvas">CANCELAR</button>
        <button type="button" class="btn btn-pacman flex-fill" id="confirmar-pedido">START</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

  <script>
  // Registrar el Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registrado correctamente'))
      .catch(err => console.warn('Error al registrar SW:', err));
  }
</script>
</body>
</html>
